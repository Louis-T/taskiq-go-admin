{{define "layout"}}<!doctype html>
<html lang="en" data-tz="{{.TZ}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"historyCacheSize": 0, "refreshOnHistoryMiss": true}'>
  <title>{{.Title}} · Taskiq Admin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%232a78d6'/%3E%3Cpath d='M4 8.5l2.5 2.5L12 5.5' stroke='white' stroke-width='2' fill='none'/%3E%3C/svg%3E">
  <script>
    try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="{{asset "app.css"}}">
  <script src="{{asset "htmx.min.js"}}" defer></script>
  <script src="{{asset "app.js"}}" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="/tasks">Taskiq Admin</a>
      <nav class="nav">
        <a href="/tasks" {{if eq .Nav "tasks"}}aria-current="page"{{end}}>Tasks</a>
        <a href="/types" {{if eq .Nav "types"}}aria-current="page"{{end}}>Task types</a>
        {{if .Redis}}<a href="/redis" {{if eq .Nav "redis"}}aria-current="page"{{end}}>Redis</a>{{end}}
        <a href="/settings" {{if eq .Nav "settings"}}aria-current="page"{{end}}>Settings</a>
      </nav>
      <span class="spacer"></span>
      <span class="muted small tz" title="Times are shown in this time zone">{{.TZ}}</span>
      <button type="button" class="btn btn-ghost icon-btn" data-theme-toggle aria-label="Toggle color theme" title="Toggle color theme">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
      </button>
    </div>
  </header>
  <main class="container">
    {{block "content" .}}{{end}}
  </main>
  <footer class="container footer muted small">taskiq-go-admin {{.Version}}</footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>{{end}}
